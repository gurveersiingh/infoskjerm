<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypehouse infoskjerm</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>HypeHouse Infoskjerm</h1>
        
        <div class="main-content">
            <div class="info-box atb-box">
                <div class="atb-header">
                    <img src="bilder/atb.png" alt="ATB Logo" class="atb-logo-image">
                    <h2>ATB Avgangstider - Lerkendal</h2>
                </div>
                <div id="departures">
                    <!-- Headers and departure rows will be inserted here -->
                </div>
            </div>
            
            <div class="side-content">
                <div class="info-box electricity-box">
                    <div id="electricity-prices">
                        <!-- Electricity prices will be inserted here -->
                    </div>
                </div>
                
                <div class="info-box clock-weather-box">
                    <div id="clock-weather">
                        <!-- Clock and weather will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="js/main.js"></script>
</body>
</html>
